name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write # ghcr.io image push
  id-token: write # cosign keyless signing
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Wails v3 linux compiles against GTK4 + WebKitGTK 6.0.
      - name: Install Linux GUI build deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev pkg-config
      - name: Install syft (SBOM) and cosign (signing)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          # cosign pinned: v2.4.x matches goreleaser's classic sign-blob
          # args; v3 changed the bundle format and breaks signing.
          curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend (tsc + vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos:
    # Darwin binaries must be built natively (CGO + Apple toolchain) and
    # uploaded to the draft release the ubuntu job created.
    runs-on: macos-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (tsc + vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install cosign (checksum signing, pinned to the goreleaser-compatible major)
        run: |
          curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-darwin-arm64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
      # Signing/notarization (Developer ID Application certificate +
      # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID secrets) activates when those
      # secrets exist — see RELEASE.md. Until then the darwin archives ship
      # unsigned and the release notes must say so.
      - name: Build and upload darwin archives
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release -f .goreleaser-darwin.yml --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign darwin checksums (keyless)
        env:
          COSIGN_YES: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cosign sign-blob --output-signature checksums-darwin.txt.sig --output-certificate checksums-darwin.txt.pem checksums-darwin.txt && gh release upload "$GITHUB_REF_NAME" checksums-darwin.txt.sig checksums-darwin.txt.pem --clobber
        working-directory: dist
